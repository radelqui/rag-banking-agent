# Lo crea DevOps/DBA, NUNCA se commitea con valores reales (usar Vault / External Secrets)
apiVersion: v1
kind: Secret
metadata: { name: rag-agent-db-secrets }
type: Opaque
stringData:
  APP_DATABASE_URL: postgresql+asyncpg://app_user:<pw>@pg.banco.svc:5432/banco
  LLAMAINDEX_DATABASE_URL: postgresql+asyncpg://ai_readonly:<pw>@pg.banco.svc:5432/banco
---
# Pasarela de modelos del banco: el microservicio nunca llama a Anthropic/OpenAI por internet
apiVersion: v1
kind: Secret
metadata: { name: rag-agent-llm-secrets }
type: Opaque
stringData:
  ANTHROPIC_API_KEY: <token de la pasarela>
  ANTHROPIC_BASE_URL: https://llm-gw.banco.svc/anthropic
  LLM_MODEL: claude-opus-5
  OPENAI_API_KEY: <token de la pasarela>
  OPENAI_BASE_URL: https://llm-gw.banco.svc/openai
  EMBED_MODEL: text-embedding-3-small
