services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://app_user:app_pw@db:5432/banco
      LLAMAINDEX_DATABASE_URL: postgresql+asyncpg://ai_readonly:ro_pw@db:5432/banco
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
