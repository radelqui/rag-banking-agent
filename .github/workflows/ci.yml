name: CI/CD
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read }   # mínimo privilegio por defecto; cada job amplía solo lo que necesita

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Security scan (SAST)
        run: bandit -r app -ll
      - name: Tests + cobertura
        run: pytest --cov=app --cov-fail-under=85

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Build (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
      - name: Escaneo de vulnerabilidades de imagen (antes de publicar)
        uses: aquasecurity/trivy-action@0.28.0   # versión fijada: nada de @master en un banco
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Push (solo si el escaneo pasó)
        run: docker push "$IMAGE_REPO:$GITHUB_SHA"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production   # puerta humana: required reviewers en Settings > Environments
    steps:
      - uses: actions/checkout@v4
      - name: Deploy a Kubernetes
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}   # secreto del banco, inyectado por el pipeline
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig
          envsubst '${IMAGE_REPO} ${IMAGE_TAG}' < k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/rag-banking-agent --timeout=180s
