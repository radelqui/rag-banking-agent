name: CI/CD
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions: { contents: read }   # mínimo privilegio por defecto; cada job amplía solo lo que necesita

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres+pgvector en vivo: mismo esquema que docker-compose local (scripts/init_db.sql),
    # para que las pruebas de integración de RAG (03-datos-rag) corran contra una BD real,
    # no solo contra FakeEngine. Petición del lead: en el PC no hay Docker para `make up`.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: banco
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_PG_PASSWORD }}   # solo vive en este runner efímero; cero literales en el YAML
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Mismas credenciales de rol que crea scripts/init_db.sql (app_user r/w, ai_readonly solo SELECT)
      APP_DATABASE_URL: postgresql+asyncpg://app_user:app_pw@localhost:5432/banco
      LLAMAINDEX_DATABASE_URL: postgresql+asyncpg://ai_readonly:ro_pw@localhost:5432/banco
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { fetch-depth: 0 }   # gitleaks necesita el historial completo, no solo el último commit
      - name: Escaneo de secretos (gitleaks) — bloquea aquí, antes de que llegue el aviso de GitGuardian
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Cargar esquema en Postgres (extensión vector + tablas + roles)
        env:
          PGPASSWORD: ${{ secrets.CI_PG_PASSWORD }}
        run: psql -h localhost -U postgres -d banco -v ON_ERROR_STOP=1 -f scripts/init_db.sql
      - name: Lint
        run: ruff check .
      - name: Security scan (SAST)
        run: bandit -r app -ll
      - name: Tests + cobertura
        run: pytest --cov=app --cov-fail-under=85

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: Build (sin publicar)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6.19.2
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
      - name: Escaneo de vulnerabilidades de imagen (antes de publicar)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0 — fija su propia dependencia setup-trivy por hash, no por tag
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Push (solo si el escaneo pasó)
        run: docker push "$IMAGE_REPO:$GITHUB_SHA"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production   # puerta humana: required reviewers en Settings > Environments
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: Deploy a Kubernetes
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}   # secreto del banco, inyectado por el pipeline
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig
          envsubst '${IMAGE_REPO} ${IMAGE_TAG}' < k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/rag-banking-agent --timeout=180s
